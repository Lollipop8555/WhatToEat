<!DOCTYPE html>
<html lang="zh">

<head>

    <link rel="stylesheet" href="./css/embed.css">

</head>

<body class="embed-page">

        </div>
        <div class="embed-modes" id="embedModes">
            <span class="embed-mode selected" data-type="human">正常人类</span>
            <span class="embed-mode" data-type="monster">非正常人类</span>
            <span class="embed-mode" data-type="oasis">oasis</span>
